<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>✈️ Travel Itinerary Planner</h1>
        <p>Plan your perfect trip with ease</p>
    </header>

    <main>

        <section class="hero">
            <h2>Plan. Explore. Enjoy.</h2>
            <p>Create a personalized travel itinerary in seconds.</p>

            <button onclick="showPlanner()">
                PLAN MY TRIP
            </button>
<br><br>

<button onclick="window.location.href='mytrips.html'">
    🧳 MY TRIPS
</button>
        </section>

        <section id="planner" class="planner">

            <h2>Plan Your Trip</h2>

            <label>Destination</label>
            <input type="text" id="destination"
                   placeholder="Enter destination">

            <label>Number of Days</label>
            <input type="number" id="days"
                   placeholder="Enter number of days">

            <label>Number of Travellers</label>
            <input type="number" id="travellers"
                   placeholder="Enter travellers">

            <label>Budget (₹)</label>
            <input type="number" id="budget"
                   placeholder="Enter your budget">

            <label>Travel Type</label>
            <select id="travelType">
                <option>Beach</option>
                <option>Adventure</option>
                <option>Historical</option>
                <option>Nature</option>
                <option>Religious</option>
                <option>City Tour</option>
            </select>

            <label>Accommodation</label>
            <select id="accommodation">
                <option>Hotel</option>
                <option>Hostel</option>
                <option>Resort</option>
                <option>Budget Stay</option>
            </select>

            <button onclick="generateItinerary()">
                GENERATE ITINERARY
            </button>

        </section>

        <section id="result" class="result">

            <h2>Your Itinerary</h2>

            <div id="itineraryOutput"></div>

            <button onclick="saveTrip()">
                💾 SAVE TRIP
            </button>

        </section>

    </main>

    <footer>
        <p>© 2026 Travel Itinerary Planner</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
